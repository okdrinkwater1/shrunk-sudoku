<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sudoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        body{
            font-family: 'VT323',monospace;
            text-align:center;
        }
        h1{
            font-family:'Press Start 2P',monospace;
            font-size:40px;
        }
        h2{
            font-weight:normal;
            font-size:28px;
        }
        button{
            font-family:'Press Start 2P',monospace;
            font-size:12px;
            padding:10px 16px;
            cursor:pointer;
        }
        #errors{
            color:red;
        }
        #board{
            width:450px;
            height:450px;
            margin:0 auto;
            display:flex;
            flex-wrap:wrap;
        }
        #digits{
            width:450px;
            height:50px;
            margin:0 auto;
            display:flex;
            flex-wrap:wrap;
        }
        #text{
            font-family:'Press Start 2P',monospace;
            font-size:16px;
            margin-top:20px;
        }
        .tile{
            width:48px;
            height:48px;
            border:1px solid lightgrey;
            font-size:20px;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .number{
            width:44px;
            height:44px;
            border:1px solid black;
            font-size:20px;
            font-weight:bold;
            margin:2px;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
        }
        .number-selected{
            background-color:yellow;
        }
        .tile-start{
            background-color:whitesmoke;
        }
        .horizontal-line{
            border-bottom:1px solid black;
        }
        .vertical-line{
            border-right:1px solid black;
        }
</style>
</head>
<body>
    <h1>Sudoku</h1>
    <h2>Life: <span id="errors">5</span>/ 5</h2>
    <button>Restart</button>
    <br><br>
    <div id="board"></div>
    <div id="digits"></div>
    <p id="text"></p>
    <script>
        let numSelected=null;
        let errors=5;
        let gameOver=false;
        let board=[
           "--74916-5",
           "2---6-3-9",
           "-----7-1-",
           "-586----4",
           "--3----9-",
           "--62--187",
           "9-4-7---2",
           "67-83----",
           "81--45---"
        ]
        let solution=[
            "387491625",
            "241568379",
            "569327418",
            "758619234",
            "123784596",
            "496253187",
            "934176852",
            "675832941",
            "812945763"
        ]
        window.onload=function(){
            document.querySelector("button").onclick=setGame;
            setGame();
        }
        function setGame(){
            numSelected=null;
            errors=5;
            gameOver=false;
            document.getElementById("errors").innerText=5;
            document.getElementById("text").innerText="";
            document.getElementById("board").innerHTML="";
            document.getElementById("digits").innerHTML="";
            for(let i=1;i<=9;i++){
                let number=document.createElement("div");
                number.id=i;
                number.innerText=i;
                number.addEventListener("click",selectNumber);
                number.classList.add("number");
                document.getElementById("digits").appendChild(number);
            }
            for(let r=0;r<9;r++){
                for(let c=0;c<9;c++){
                    let tile=document.createElement("div");
                    tile.id=r.toString()+"-"+c.toString();
                    if(board[r][c]!="-"){
                       tile.innerText=board[r][c];
                       tile.classList.add("tile-start");
                    }
                    if(r==2||r==5){
                        tile.classList.add("horizontal-line");
                    }
                    if(c==2||c==5){
                        tile.classList.add("vertical-line");
                    }
                    tile.addEventListener("click", selectTile);
                    tile.classList.add("tile");
                    document.getElementById("board").append(tile);
                }
            }
        }
        function selectNumber(){
            if(numSelected!=null){
                numSelected.classList.remove("number-selected");
            }
            numSelected=this;
            numSelected.classList.add("number-selected");
        }
        function selectTile(){
            if(numSelected&&!gameOver){
                if(this.innerText!=""){
                    return;
                }
                let coords=this.id.split("-");
                let r=parseInt(coords[0]);
                let c=parseInt(coords[1]);
                if(solution[r][c]==numSelected.id){
                    this.innerText=numSelected.id;
                    checkVictory();
                }
                else{
                    errors-=1;
                    document.getElementById("errors").innerText=errors;
                    if(errors==0){
                        gameOver=true;
                        document.getElementById("text").innerText="GAME OVER!!!!";
                        document.getElementById("text").style.color="red";
                    }
                }
            }
        }
        function checkVictory(){
            let tiles=document.getElementsByClassName("tile");
            for(let i=0;i<tiles.length;i++){
                if(tiles[i].innerText==""){
                    return;
                }
            }
            gameOver=true;
            document.getElementById("text").innerText="YOU WIN!!!!";
            document.getElementById("text").style.color="green";
        }
    </script>
</body>
</html>
