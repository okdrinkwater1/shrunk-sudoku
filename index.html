<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sudoku</title>
</head>
<body>
    <h1>Sudoku</h1>
    <hr>
    <h2 id="errors">0</h2>
    <div id="board"></div>
    <br>
    <div id="digits"></div>
    <style>
        body{
            font-family: Arial,Helvetica,sans-serif;
            text-align:center;
        }
        hr{
            width:500px;
        }
        #errors{
            color:coral;
        }
        #board{
            width:450px;
            height:450px;
            margin:0 auto;
            display:flex;
            flex-wrap:wrap;
        }
        #digits{
            width:450px;
            height:50px;
            margin:0 auto;
            display:flex;
            flex-wrap:wrap;
        }
        .tile{
            width:48px;
            height:48px;
            border:1px solid lightgrey;
            font-size:20px;
            font-weight:bold;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .number{
            width:44px;
            height:44px;
            border:1px solid black;
            font-size:20px;
            font-weight:bold;
            margin:2px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
    </style>
    <script>
        var numSelected=null;
        var tileSelected=null;
        var errors=0;
        var board=[
           "--74916-5",
           "2---6-3-9",
           "-----7-1-",
           "-586----4",
           "--3----9-",
           "--62--187",
           "9-4-7---2",
           "67-83----",
           "81--45---"
        ]
        var solution=[
            "387491625",
            "241568379",
            "569327418",
            "758619234",
            "123784596",
            "496253187",
            "934176852",
            "675832941",
            "812945763"
        ]
        window.onload=function(){
            setGame();
        }
        function setGame(){
            for(let i=1;i<=9;i++){
                let number=document.createElement("div");
                number.id=i;
                number.innerText=i;
                number.classList.add("number");
                document.getElementById("digits").appendChild(number);
            }
            for(let r=0;r<9;r++){
                for(let c=0;c<9;c++){
                    let tile=document.createElement("div");
                    tile.id=r.toString()+"-"+c.toString();
                    tile.classList.add("tile");
                    document.getElementById("board").append(tile);
                }
            }
        }
    </script>
</body>
</html>
